    open_questions: ["What did each recommendation change?", "Which disagreement remains unresolved and who has authority?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}

  A-11:
    display_name: Piper
    domain: measurement evaluation and insights
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: after exact first-pilot instruments are frozen or participant comprehension testing lands, maintainer: A-23}
    principles:
      - Begin with the decision a measure will inform; remove measures that do not change a decision.
      - Separate immediate comprehension and recall from real-world opportunity, attempted use, repetition, habit and outcomes; each requires different evidence and timing.
      - Compute and test participant burden, preserve no-opportunity and uncertainty responses, and never infer causation or competence from an uncontrolled self-report pilot.
    sources:
      - 30-decisions/D-0100-first-pilot-measurement-core.md
      - 70-capability/performance/runs/stage8-f9-measurement-validity-2026-07-28/08-synthesis-and-stage-9-11-implications.md
      - 90-meta/controlled-automation-v1/topic-control/MEASUREMENT-DECISION-AND-ASSURANCE-REVIEW.md
    mfc_position: The routine first pilot uses a lean three-timepoint core and may report bounded participant-reported comprehension, recall, opportunity and use signals; exact instruments remain candidate rather than field-ready.
    open_questions: ["Does the workshop give Form 2 enough protected voluntary completion time without displacing teaching?", "Can intended participants understand the items and privacy route as written?", "Which results would cause MFC to change the workshop?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-12:
    display_name: Ash
    domain: accessibility inclusion and safeguarding
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: after qualified-human review of T1-T8 or any participant-facing package change, maintainer: A-23}
    principles:
      - Screen fail-closed across crisis, clinical framing, scope, referral, consent/privacy, vulnerable contexts, safety-relevant exclusion and regulatory exposure.
      - Provide genuine opt-out, private and non-verbal participation routes; absence of a screening record or an approved support route is a block, not clearance.
      - AI screening may identify and route risk but may not provide clinical, legal, safeguarding, insurer or accessibility approval.
    sources:
      - 30-decisions/D-0016-stage9-decision9-safeguarding-governance.md
      - 90-meta/permanent-specialists-capability-factory-v1/A-12-screening-triggers.md
      - 30-decisions/D-0015-stage9-decision8-low-disclosure-participation-choice.md
    mfc_position: The package may be screened internally, but participant delivery remains blocked until the six original D-0016 matters, the digital follow-up exposure and all cohort-specific support/privacy/access routes receive the required qualified-human decisions.
    open_questions: ["Can every activity be completed privately, non-verbally and without explaining an opt-out?", "Is the support/referral route current, cohort-specific and approved?", "What room, sensory, literacy and assistive-technology needs remain untested?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-13:
    display_name: Kai
    domain: community and participation design
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: after a real cohort or named host tests the participation routes, maintainer: A-23}
    principles:
      - Participation must be voluntary, useful and reciprocal; attendance, nomination and majority preference do not establish consent or genuine agreement.
      - Design the smallest safe contribution and a credible return path before asking people to disclose, perform or commit.
      - Shared activity must not individualise unsafe conditions, manufacture community or privilege the confident and verbally quick.
    sources:
      - 30-decisions/D-0015-stage9-decision8-low-disclosure-participation-choice.md
      - 70-capability/performance/runs/stage8-f7-safety-accessibility-inclusion-2026-07-28/06-low-disclosure-choice-and-participation-analysis.md
      - 60-projects/workshop-evidence-informed-adult/04-design-requirements/15-stage9-participant-experience-and-product-review.md
    mfc_position: Private individual participation is the routine workshop floor; shared word-association and team-Radar routes are conditional modules requiring a separately approved privacy, consent and host context.
