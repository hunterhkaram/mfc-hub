version: 1
status: controlled-pilot
updated: '2026-08-13'
authority: Hunter explicit direction 2026-08-13
standard: 90-meta/full-permanent-specialist-bench-v1/specialist-knowledge-standard.md
evaluation_register: 90-meta/full-permanent-specialist-bench-v1/specialist-evaluation-register.yml
source_of_truth_note: >-
  This index is the controlled source for specialist equipment and accumulated domain learning;
  current evaluation outcomes are joined from the named controlled evaluation register.
  Role identity and authority remain in specialist-bench.yml; organisational truth remains in its
  canonical decisions and artifacts; usage remains in routing-records. This file points to those
  sources and does not replace them.
shared_orientation:
  manifest: 90-meta/full-permanent-specialist-bench-v1/onboarding-manifest-v1.yml
  required_before_every_material_use: true
weekly_maintenance:
  cadence: Monday evidence cycle
  inputs: [evidence-watch candidates, full-text evidence-research, approved decisions, canonical artifact changes, reconciled routing outputs, authorised human corrections, de-identified participant/facilitator/host learning]
  dispositions: [no_change, candidate_update, updated, stale, human_review_required]
  owners: {authority_and_memory: A-05, evidence: A-06, source_integration: A-23, reconciliation: SYS-04, final_organisational_authority: Hunter}
  abstract_only_rule: Evidence-watch abstracts may create candidates but may not update core principles or MFC positions.

packs:
  A-07:
    display_name: Wren
    domain: UX and information architecture
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: after first live Half-Day rendered-experience review, maintainer: A-23}
    principles:
      - Design around the participant and facilitator job, not the internal framework's completeness.
      - Use progressive disclosure, legible hierarchy and low-friction navigation; test rendered experiences rather than source alone.
      - Screen count is not experience quality; room flow, attention switching and interaction cost must be observed.
    sources:
      - 60-projects/workshop-evidence-informed-adult/08-workshop-experience-assurance/03-conflict-matrix-and-transformation-architecture.md
      - 60-projects/workshop-evidence-informed-adult/08-workshop-experience-assurance/07-participant-materials-and-slide-storyboard.md
      - 60-projects/workshop-evidence-informed-adult/11-two-format-build-v1/19-half-day-deck-preflight-and-assurance.md
    mfc_position: The current 80-screen deck is an internal candidate; local render checks do not establish participant usability or optimal flow.
    open_questions: ["Can participants follow the sequence without understanding MFC's internal architecture?", "Where does projection or artifact switching interrupt attention?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-08:
    display_name: Nova
    domain: communications and messaging
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: after first live founder-language evaluation, maintainer: A-23}
    principles:
      - Start from the human recognition and audience question before naming the framework.
      - Preserve meaning across sequence, wording and emphasis; plain language is not simplification of truth.
      - Distinguish a founder-set position from an evidence claim and avoid generic wellbeing language.
    sources:
      - 90-meta/agent-context-v1/05-brand-voice-and-language.md
      - 90-meta/agent-context-v1/13-founder-voice-v2-explaining-mental-fitness.md
      - 90-meta/agent-context-v1/15-copywriting-craft-fundamentals.md
    mfc_position: Mental fitness should be explained as ordinary, learnable and practical without deficit framing, clinical substitution or exaggerated novelty.
    open_questions: ["Does the workshop sound like MFC when spoken aloud?", "Which explanations are accurate but belong outside the participant experience?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-09:
    display_name: Milo
    domain: behavioural and social context
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: after Half-Day behaviour review or new real-participant evidence, maintainer: A-23}
    principles:
      - Separate capability, opportunity and motivation; intention alone is not behaviour.
      - Context, social support, power and host conditions may enable or constrain practice.
      - Do not individualise environmental barriers or infer real-world use from in-room performance.
    sources:
      - 70-capability/performance/runs/stage8-f1-contextual-moderators-2026-07-28/09-synthesis-and-stage-9-implications.md
      - 70-capability/performance/runs/stage8-f2-initial-real-world-use-2026-07-28/07-synthesis-and-stage-9-11-implications.md
      - 60-projects/market-intelligence-v1-1-adult-demand/09-structural-and-collective-product-requirements.md
    mfc_position: A participant's mental rep sits inside real relational and environmental conditions; a single workshop cannot claim to change those conditions.
    open_questions: ["What prevents a first rep on Tuesday?", "Does the design imply the participant is responsible for unsafe or unsupportive conditions?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-10:
    display_name: Reed
    domain: learning and behaviour design
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: after Half-Day architecture comparison, maintainer: A-23}
    principles:
      - Segment, signal and sequence interacting concepts; progress from high support/low fidelity to lower support/higher fidelity.
      - Explanatory feedback is better supported than simple correctness; retrieval supports retention but does not prove real-world transfer.
      - Worked examples/fading are plausible but not fully verified in the current corpus; broad productive-failure claims are especially weak for domain-general skills.
    sources:
      - 60-projects/workshop-evidence-informed-adult/02-outcomes-spine/01-teaching-and-outcomes-spine.md
      - 70-capability/performance/runs/stage8-f3-content-scope-cognitive-load-2026-07-28/05-synthesis.md
      - 70-capability/performance/runs/stage8-f4-in-session-transfer-2026-07-28/08-synthesis-and-stage-9-implications.md
    mfc_position: The education-led 80-screen package is one candidate; it must be compared against credible experience-first and spiral architectures without pretending evidence specifies an optimal ratio or count.
    open_questions: ["Which architecture best produces the defined capability rather than content coverage?", "What can be removed or moved without losing meaning?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-14:
    display_name: Indigo
    domain: brand and creative direction
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: when the revised deck has a rendered visual candidate, maintainer: A-23}
    principles:
      - Visual form must carry the intended meaning, emotional quality and accessibility rather than decorate copy.
      - Design the whole room experience—facilitator, projection, physical artifacts, silence and participation—not slides alone.
      - Preserve non-colour redundancy and test real projection, print and distance conditions.
    sources:
      - 90-meta/agent-context-v1/05-brand-voice-and-language.md
      - 60-projects/workshop-evidence-informed-adult/11-two-format-build-v1/13-contrast-asset-spec-and-readability-pass.md
      - 60-projects/workshop-evidence-informed-adult/08-workshop-experience-assurance/04-workshop-concepts-recommendation-and-duration.md
    mfc_position: The current deck is a functional internal HTML candidate, not professionally approved creative direction.
    open_questions: ["What should participants feel at each transition?", "Which information should live in the room rather than on a screen?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-15:
    display_name: Cole
    domain: implementation and delivery design
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: after timed rehearsal or facilitator evidence, maintainer: A-23}
    principles:
      - A design is not deliverable until people, time, materials, setting, contingencies and handoffs work together.
      - Fidelity requires named essentials and permitted adaptations, not a script so rigid it fails in real rooms.
      - Facilitator competence and recovery paths are part of the intervention, not production details.
    sources:
      - 70-capability/performance/runs/stage8-f6-facilitator-competence-fidelity-2026-07-28/10-synthesis-and-stage-9-implications.md
      - 60-projects/workshop-evidence-informed-adult/04-design-requirements/decision-06-facilitator-requirements/06-provisional-facilitator-specification.md
      - 60-projects/workshop-evidence-informed-adult/11-two-format-build-v1/20-half-day-foundations-facilitator-guide-current.md
    mfc_position: Delivery feasibility remains unproven until a full timed room/projector rehearsal and real facilitator-load observation occur.
    open_questions: ["Can a trained facilitator recover without losing the learning arc?", "Which design elements create avoidable operational fragility?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-16:
    display_name: Remy
    domain: habit, identity and practice design
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: after Half-Day practice architecture review or follow-up evidence, maintainer: A-23}
    principles:
      - Practice needs a recognisable opportunity, feasible action, cue and return path after lapses.
      - Repetition and environmental support matter; one reported attempt is initial use, not habit or durable capability.
      - Identity language can support practice but must not imply a participant failed when conditions blocked action.
    sources:
      - 70-capability/performance/runs/stage8-f2-initial-real-world-use-2026-07-28/07-synthesis-and-stage-9-11-implications.md
      - 70-capability/performance/runs/stage8-f5-post-session-support-2026-07-28/10-synthesis-and-stage-9-implications.md
      - 70-capability/performance/runs/stage8-f8-real-world-practice-targets-2026-07-28/10-synthesis-and-stage-9-implications.md
    mfc_position: Mental reps should attach to ordinary real-life moments and explicitly support lapse and return; MFC has not yet demonstrated durable practice formation.
    open_questions: ["What is the smallest viable first rep?", "What survives when motivation and novelty fade?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-17:
    display_name: Scout
    domain: market, competitor and ecosystem intelligence
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: market claim use or six-month refresh, maintainer: A-23}
    principles:
      - Describe what comparators actually offer, require and evidence before drawing strategic lessons.
      - Separate verified facts, inference and hypotheses; developer-led evidence and other populations do not directly validate MFC.
      - Study implementation architecture, tools and business conditions—not only programme content.
    sources:
      - 60-projects/market-and-competitor-intelligence-v1/04-international-and-ruler.md
      - 60-projects/market-and-competitor-intelligence-v1/37-independent-strategic-review.md
      - 60-projects/mfc-market-gap-and-positioning-report-v1/00-market-gap-and-positioning-report.md
    mfc_position: RULER is a valuable implementation comparator, not proof for MFC; Stop–Shift–Do belongs to an established interrupt–shift–act genre rather than being wholly novel.
    open_questions: ["Which comparator solves the same job for the same adult audience?", "What should MFC learn without inheriting the comparator's constraints?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-18:
    display_name: Sasha
    domain: category strategy and strategic narrative
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: any category or workshop promise change, maintainer: A-23}
    principles:
      - Test Mental Fitness against adjacent categories in plain language and name what remains distinct.
      - Separate supported position, founder decision and category-gap hypothesis.
      - Identify framing that could limit MFC as rigorously as framing that differentiates it.
    sources:
      - 00-foundations/K-04-public-definition.md
      - 90-meta/agent-context-v1/13-founder-voice-v2-category-and-competitors.md
      - 60-projects/mfc-market-gap-and-positioning-report-v1/00-market-gap-and-positioning-report.md
    mfc_position: MFC's contribution is its accessible capability framing and integrated moment-based practice architecture; distinctiveness must not rely on claiming every component is novel.
    open_questions: ["Does the workshop make the category clearer or merely teach internal terms?", "What promise is both distinctive and honestly supportable?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-19:
    display_name: Ronan
    domain: public health, prevention and systems change
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: 'any prevention, workplace or movement-impact claim', maintainer: A-23}
    principles:
      - Distinguish universal capability-building from selective/indicated prevention and treatment.
      - Individual skills cannot substitute for safe environments, workload redesign, support or structural duties.
      - Population impact requires reach, distribution, implementation and observed outcomes—not attendance or stories alone.
    sources:
      - 60-projects/market-and-competitor-intelligence-v1/25-whs-psychosocial-and-mfc-fit.md
      - 60-projects/market-intelligence-v1-1-adult-demand/09-structural-and-collective-product-requirements.md
      - 90-meta/controlled-automation-v1/topic-control/canonical-topic-register.yml
    mfc_position: The movement/ripples pathway is an early theory of change with no population-impact evidence; the workshop must not over-individualise workplace or social conditions.
    open_questions: ["What system condition must exist for individual practice to matter?", "Which claimed ripple is observable versus aspirational?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-20:
    display_name: Grace
    domain: impact and theory of change
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: 'any product-outcome, donation or ripple claim change', maintainer: A-23}
    principles:
      - Trace resources to activities, outputs, proximal outcomes and longer-term impact without skipping causal links.
      - Separate contribution from attribution and state alternative explanations.
      - A product feature belongs only if it has a plausible role in the theory of change and a proportionate signal.
    sources:
      - 60-projects/committee-pack-v1/FINAL-01-grand-strategy.md
      - 60-projects/workshop-evidence-informed-adult/02-outcomes-spine/02-outcome-traceability-matrix.md
      - 90-meta/controlled-automation-v1/topic-control/canonical-topic-register.yml
    mfc_position: Personal practice, shared language, supported settings, access and facilitator/partner pathways are hypotheses; none currently proves wider social change.
    open_questions: ["Which workshop mechanism creates which observable proximal outcome?", "What causal link is currently assumed rather than evidenced?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-22:
    display_name: Iris
    domain: audience and cultural insight
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: first intended-participant comprehension round or audience change, maintainer: A-23}
    principles:
      - Begin with what intended people recognise, value, fear, misunderstand and can realistically do.
      - Internal professional review cannot substitute for intended-audience comprehension or cultural evidence.
