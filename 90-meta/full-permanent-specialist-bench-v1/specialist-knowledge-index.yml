    open_questions: ["What would a first-time participant misunderstand or resist?", "Who is absent from the current audience evidence?"]
    learning_records: []
    evaluation: {status: passed_independent_substantive_evaluation, evidence: 90-meta/full-permanent-specialist-bench-v1/evaluations/2026-08-13-governed-retest/checker-results/00-aggregate-decision.md, independent_checker_context: independent_retest_checker, holdout_passed: true}
  A-23:
    display_name: Talia
    domain: knowledge engineering and source integration
    state: evaluated_pack
    review: {last: '2026-08-13', next_trigger: first weekly specialist-knowledge transaction, maintainer: A-05}
    principles:
      - Keep role identity, organisational truth, evidence, usage and accumulated learning in their proper controlled sources.
      - Preserve supersession and rejected reasoning; newer or more polished does not automatically mean authoritative.
      - A pointer should retrieve canonical material without copying it into a second truth store.
    sources:
      - 90-meta/retrieval-reliability-source-precedence/01-source-precedence-model-and-reliability-standard.md
      - 90-meta/project-learning-and-memory-v1/06-correction-propagation-protocol.md
