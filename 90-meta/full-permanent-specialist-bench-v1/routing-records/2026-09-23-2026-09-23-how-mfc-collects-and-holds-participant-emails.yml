  - Which roles genuinely bear on this task, and which would only add volume
  omissions_challenged:
  - 'The screen that mattered here was whether to run anyone at all, because the question Hunter asked
    was already ruled on. 25-EMAIL-CAPTURE-RULING.md, dated 2026-09-15, permits collection for the sole
    purpose of sending a form link and names four build conditions. Citing it and stopping was the tempting
    answer and would have been wrong: the ruling says MFC MAY collect an address and is silent on how,
    which is the entire content of Hunter''s question. Both heads were run without being shown each other''s
    brief and landed on the same design as the ruling, which is stronger confirmation than re-reading
    the ruling could ever be, and both then found defects the ruling did not contain. lens-debra-fidler
    was reconsidered and excluded because it ran two turns earlier on this same material and its finding,
    that the email list was undisclosed, is what prompted this question; running it again would have reported
    its own output back. head-of-compliance was reused rather than executed because the participant-facing
    wording it wrote this morning is a constraint on the answer rather than a question for it, and the
    two genuinely new compliance questions the heads surfaced are recorded as open for it rather than
    answered here.'
  changes: []
  unresolved:
  - 'What happens to a withdrawal email once actioned is open and is head-of-compliance''s: the proposed
    rule is act on it, delete the response, then delete the email and its thread, but whether MFC must
    retain proof a withdrawal was honoured is unconfirmed. The facilitator script has not been past lens-eimear-quigley
    and what is said aloud in a room is her territory. The client no-chase contract clause is a draft
    for Bird and Bird rather than a finished term. AG-007 remains the most exposed open item in the set
    and is unrelated to this question. MFC has delivered zero cohorts, so the completion rate this produces
    is unknown against AG-176''s 15 percent.'
  reconciler: SYS-04 — Loop Engineer
  reconciliation: Coverage retained as screened; contributions recorded as they actually occurred, and
    exclusions carry stated reasons.
learning_disposition: no_new_learning
what_changed_because_a_specialist_ran: 'The two heads produced the operational answer the existing ruling
  lacked, and agreed without contact. A separate one-field form at the close of the session, riding on
  the moment Form 3 is already being completed, with the cohort as a hidden parameter and no code field,
  so the separation is structural rather than procedural: address and response never arrive together and
  there is no key joining them. head-of-delivery took the client-sends option seriously and rejected it
  on three specific grounds, the strongest being that the client would then know who completed and who
  did not, which in a room of eight is a coercion problem MFC cannot see or stop, and which contradicts
  the never-a-breakdown-by-team promise the consent panel already makes. head-of-digital reframed AG-195''s
  encryption requirement as access rather than cryptanalysis, on the wording of the quote itself, and
  rejected client-side encryption, password-protected files and Workspace CSE as invented gates, noting
  that a file which must be unlocked to send a reminder is a file that gets copied to the desktop. It
  rejected mail-merge because tracking is on by default in every platform and that is the join path reintroduced
  by a checkbox, and rejected an Apps Script deletion trigger because a silent failure in a deletion job
  is indistinguishable from success. Two defects were found. The privacy page said nobody else sees the
  list while Code.gs requires a second Workspace admin so MFC does not lose its data if Hunter is unavailable:
  right arrangement, wrong sentence, on wording added the same morning, now fixed to say the list is used
  by one named person and to explain the second pair of hands as what lets a deletion request survive
  his absence. And the withdrawal route asks participants to email an address, a code and a cohort in
  one message, which is exactly the joined record the architecture prevents, landing in an ordinary inbox
  where nothing governs it.'
