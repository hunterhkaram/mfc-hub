  framing") did not catch: a real pricing-table factual error, a total safeguarding-disclosure gap, or
  the unverified-assumption/against-case omissions in the founding-rate mechanism. A genuine multi-lens
  panel run for the first time found all of these in one pass. This is offered as evidence for the
  panel's value, not as a claim that this one run proves the model always works -- one data point.
