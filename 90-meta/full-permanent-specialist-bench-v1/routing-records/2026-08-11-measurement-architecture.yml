  60-projects/committee-pack-v1/B5c-timepoints-and-the-durability-lock.md;
  60-projects/committee-pack-v1/B5b-item-bank-literal-wording.md;
  60-projects/committee-pack-v1/R9-research-partnership-strategy.md
context: >
  Hunter's direct request, 2026-08-11: the exact measurement forms and every specific question at
  four timepoints (pre / immediate-post / 3-4 weeks / 3 months), rationale for everything, certainty
  that the design will not need altering over time, plus the strategy for connecting with a research
  university. Classified MFC_MATERIAL by route_mfc_intake.py and answered "yes, full executive
  intake" at the CLAUDE.md section 9d material-choice gate, which per how-to-run-a-real-panel.md
  mandates a real multi-specialist panel rather than a single producer/checker loop.
  Model economy per Hunter's instruction: strategy and synthesis in Opus, all build and review work
  delegated to Sonnet and Haiku agents.

