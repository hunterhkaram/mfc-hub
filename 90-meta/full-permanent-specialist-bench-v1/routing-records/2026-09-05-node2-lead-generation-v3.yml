  decision_surfaces:
  - Which roles genuinely bear on this task, and which would only add volume
  omissions_challenged:
  - 'A-15 (Implementation and Delivery Design) and the founder-capacity lens were reconsidered and excluded,
    and both exclusions are contestable. Capacity IS the binding constraint - the adversarial pass showed
    the honest total is ~6-7.3h/wk inside an 11.5h delivery week nobody has shown Hunter - but what that
    produces is Hunter''s own time allocation (FQ11), not a specialist judgement, and the plan surfaces
    it rather than resolving it. A-15 owns what happens after a sale, and the adversarial pass found the
    plan''s largest structural gap is exactly that: no price answer, no scoping call, no proposal, no
    contract. Section 1.5 names and costs those four artefacts and deliberately does NOT write them, routing
    them to A-15 and A-17, because drafting buyer-facing commercial language inside a lead-generation
    plan is how a fourth wording of a governed construct gets created - the precise failure A-12 caught
    elsewhere in this same build. A-06/researcher was run for the cadence-evidence and gatherings questions
    rather than a full evidence lens, which was right because no claim in this plan is new; every one
    traces to 11-PERMITTED-CLAIMS.md.'
  changes: []
  unresolved:
  - 'Eleven founder questions, of which FQ11 (five hours produces ~10 cohorts against a minimum viable
    of 13 - accept, give 7-8 hours, or change the mix) is the decision the document turns on. FQ4 reverses
    D-0111 section 3 if accepted. G1 is the one PARTIAL of 26: channel 5''s 0.2 clients has no itemised
    inputs. The insurance exposure at section 3.3 is real and unchanged until Osman answers a broker email
    drafted 1 September and still unsent. The ambassador programme''s own status is a live registered
    conflict (FQ8). MFC has no privacy determination and no delivered cohort.'
  reconciler: SYS-04 — Loop Engineer
  reconciliation: Coverage retained as screened; contributions recorded as they actually occurred, and
    exclusions carry stated reasons.
