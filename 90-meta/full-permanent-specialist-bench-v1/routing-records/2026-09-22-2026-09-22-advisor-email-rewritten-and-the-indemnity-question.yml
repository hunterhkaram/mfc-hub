what_changed_because_a_specialist_ran: 'head-of-compliance changed the email in three ways and reframed
  the whole item. It removed Debra Fidler from the insurance question entirely: her authority is evidence
  design and measurement and none of it bears on whether MFC carries a policy, so the email now says so
  plainly rather than addressing her by default. It corrected the framing from exposure to procurement
  readiness, on the grounds that MFC holds more public liability than most organisations its size, bought
  through a broker and committee-approved, and that the PI gap is far more likely to cost a contract than
  a claim. And it surfaced two things more urgent than the PI debate that Hunter had not asked about:
  the policy''s declared occupation describes a community health centre rather than paid training in client
  workplaces, which if undisclosed risks the cover MFC does hold being argued down at claim time, and
  no certificate of currency has ever been filed despite a July 2025 committee action, which procurement
  asks for before it asks about PI. Both are broker questions and neither depends on the advisers'' answer.'
