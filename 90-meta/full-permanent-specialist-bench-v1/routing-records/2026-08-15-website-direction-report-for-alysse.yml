schema_version: 2
objective: 'Take ownership of MFC''s overall website direction and produce one report Hunter can give
  directly to Alysse Curran so she can improve the website''s structure, flow and page experience. Independently
  reconstruct the strongest MFC website from the full corpus rather than summarising or implementing the
  14 August 2026 Hunter x Alysse meeting. Solve the stated problem: the site communicates MFC''s framework
  better than it makes a person understand why mental fitness matters to them, the gap MFC exists to close,
  what is distinctive, how the ideas connect, what they can do, what is free, where to go next, and why
  MFC as an organisation matters.'
task_session_id: a6685940-17d1-4eb2-ad44-e3440ed9f809
