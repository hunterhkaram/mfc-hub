what_changed_because_a_specialist_ran: 'The contradiction sweep is now section 5a of the mfc-board-paper
  skill, carrying the three rules that made it work, an explicit statement that it does not count against
  the cap of two adversarial passes, and the instruction to check a paper''s research summary against
  the source corpus rather than only against itself. Six market-claim corrections were applied: the audience
  composition replaced with the source''s actual 42 scoped, six open, ten unestablished; the false statement
  that clinical treatment was outside the census scope replaced with the fact that the census counts one
  treatment service and it does not publish enactment either; the six-claim test separated from the measurement
  finding with the arithmetic closed; the fifteen-of-34 comparator caveat carried forward; Appendix A
  naming both live limits; and two claims fixes, an unbounded universal negative recast as a fact about
  the material and the summary''s wording aligned to section 2. Contents renumbered and verified against
  the rendered PDF after the sections shifted.'
