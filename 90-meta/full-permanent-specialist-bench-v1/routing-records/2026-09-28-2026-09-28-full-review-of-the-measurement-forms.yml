what_changed_because_a_specialist_ran: 'Eleven errors fixed and verified, none of them a design change.
  Four were data losses the earlier break-tests missed because each was invisible in the downloaded JSON:
  the please-say-where text rendered and was discarded on every submission, the backend never wrote consent
  or form version, text beginning with = became a spreadsheet formula, and the error message promised
  nothing is lost while nothing restores the draft. One biased the headline result: Forms 2 and 4 told
  participants no and never were the answers most needed while Form 5 did not, and the primary change
  score runs Form 2 to Form 5, so improvement was built in by wording. The rest were wording errors: the
  definition printed twice on Form 1-PRE, first-before-anything-else at item four, WHO-5 introduced as
  different from the ones above when it is first, the email subject line rendering on Form 4, duplicated
  gym framing, Form 4''s three minutes that is really six, and wrong question counts on the index. Eight
  advisor positions nothing had answered were recorded in section 5, including AG-015, which is Debra''s
  own answer to her own AG-014, and AG-454 against AG-468, both HARD, a live disagreement on what counts
  as a mental rep that the forms currently contain both sides of. Seven changes to approved wording or
  the approach were written as cases and not applied, including the recall item that gives away its own
  answer, found independently by two reviewers.'
