  - 'Seven proposals await Hunter: the recall item, the Form 4 barriers item, the Form 5 work gate biasing
    IMTTAQ upward, don''t-know versus won''t-say coding, Form 3''s same-day 2b, the Form 4 Radar option
    overlap, and one sheet tab for all forms. AG-454 versus AG-468 is the advisors'' to settle. AG-197
