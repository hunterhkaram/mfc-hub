  omissions_challenged:
  - 'The skeptic was reconsidered and not run, and the reason is structural rather than economy. Three
    reviewers were each told the same rules and each read the forms from a different side - advisor record,
    reader, and data path - without sight of each other''s brief. Where they converged, on the recall
    item and the priming line, that convergence is stronger evidence than a fourth adversarial read would
    add, and every data-loss claim was independently reproduced end to end before anything was fixed.
    lens-eimear-quigley and lens-debra-fidler were reconsidered because the sweep turned up their positions,
    and excluded because those lenses ran five days ago on this material and the new findings are register
    facts, verified directly, not inferences about how the advisors would react. head-of-compliance was
    reconsidered for the consent-and-code findings and excluded because none changes a claim: the anonymous-beside-a-code
    wording question is carried as a copy note rather than acted on.'
  changes: []
