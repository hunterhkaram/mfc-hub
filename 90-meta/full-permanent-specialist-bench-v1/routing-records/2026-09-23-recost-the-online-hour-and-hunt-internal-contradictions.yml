  omissions_challenged:
  - 'head-of-commercial is the exclusion that needs justifying, because this turn changed what the charity
    keeps on a product from 186 to 335 dollars. It is excluded because the change was Hunter''s own judgement,
    stated plainly - he said the online hour was carrying too much cost and he wanted more back to the
    charity - and because the recost was built from his own description of the work rather than composed:
    0.75 booking, 0.75 preparation, 1.00 delivery. The arithmetic was put in front of him before it was
    written, and the 2.43-hour difference from the in-person hour reconciles line by line against Appendix
    C, which the scanner now verifies on every build. head-of-product and head-of-digital were named mandatory
    by the trigger map and are irrelevant: nothing about what a participant experiences changed, and no
    website, form or data capture was touched. A-25 and A-08 were excluded because this turn changed figures
    and consistency, not structure or register.'
