what_changed_because_a_specialist_ran: 'The online Hour recosted from 4.93 hours and 351 dollars to 2.50
  hours and 165 dollars, so at 500 dollars the charity keeps 335 rather than 186. Appendix C now carries
  both the in-person and online breakdowns, and the scanner verifies both independently. Four internal
  contradictions closed: a totals figure labelled as preparation, two timeline clashes between sections
  7 and 8, and a standing commitment the Hour broke. A fifth was checked and rejected: about 1,000 dollars
  for both components off is correct, because only 2.5 of the report''s 4.92 hours come off; the explanation
  for that had been lost when the table was trimmed and was restored rather than the number changed. Everything
  committed in four separate commits as it was verified.'
