  - 'A-15 (Implementation and Delivery Design, head-of-delivery) was reconsidered at length and excluded,
    and that exclusion is contestable. Section 5 model (b) recommends reinstating a monthly retainer whose
    blocking gaps are an SLA (AG-232), cancellation and pause terms for a recurring product, and a run
    sheet that has never been written — all three are A-15''s subject matter, not A-21''s. Excluded because
    this paper produces a commercial case and a recommendation, not a delivery design, and every one of
    those gaps is named in the paper as a precondition rather than resolved inside it. If Hunter answers
    FQ3 yes, A-15 must run before anything is quoted. A-23 (Knowledge Engineering and Source Integration,
    head-of-research) was also excluded despite section 4 finding that P27''s missing cite is the single
    highest-value unblock for this whole pricing case — excluded because filling it is a source-registration
    task with its own K-09 process, not a pricing judgement, and starting it here would have produced
    an unregistered citation inside a commercial paper. A-25 and H-01 were screened: no committee process
    is taken here and no clinical boundary is moved, though H-01''s standing ruling on published case-study
    quotes is carried in 4.7 item 7.'
  changes: []
  unresolved:
  - 'GST registration status is contradicted inside MFC''s own documents and moves every figure by up
    to 10% (accountant). Hunter''s available hours H, his required personal income, MFC''s fixed annual
    costs, and any conversion rate are all NO VAULT SOURCE. No advisor has reviewed these specific numbers.
    MFC has zero delivered cohorts and has never quoted a price to anyone. Black Dog Institute''s free
    government-funded workplace training to NSW businesses under 200 staff is unaddressed anywhere in
    MFC''s pricing logic. Five founder questions stand: a satisfaction condition in terms, Foundations
    banding (a real 6-8% rise for some cohorts), a fourth priced retainer product, a partner/channel price,
    and which buyer MFC prices for given the D1 and 04-THE-STRATEGY conflict.'
