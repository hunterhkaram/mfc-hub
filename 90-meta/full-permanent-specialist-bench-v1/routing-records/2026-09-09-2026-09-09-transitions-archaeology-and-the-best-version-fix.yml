    which is the 831-identical-sentences failure wearing a new costume, and CLAUDE.md section 12 bars
    it. Second was parsing the canonical topic register for declared paths; the register is a changelog
    whose paths sit inline in prose, three parse attempts failed, and the cost exceeded the return. The
    shipped version matches the topic''s own name against project directory names - crude, unbreakable,
    and it found 268 artefacts where the clever versions found zero. Second challenge, and it reframes
    the whole problem: the August decks WERE marked superseded. The topic register says ''the former HTML
    artefacts are rebuild inputs only.'' The marking existed in a changelog entry inside a thousand-line
    YAML file while the files themselves said nothing, so three separate passes today found them and assumed
    they were live. MFC does mark things - in places nobody reads. Third, self-caught and disclosed to
    Hunter rather than buried: the nine-section architecture this system authored put ''why knowing isn''t
    enough'' before ''what you actually do'', which reverses beats 9 and 10 of the script and contradicts
    D-0131''s rule that nothing is reordered. Founder-voice wrote to the reversed version. Surfaced as
    Hunter''s decision, not resolved unilaterally.'
