what_was_missed_and_why:
  finding: >-
    Two of three specialist reviewers (Verity, Compass) reached a wrong primary conclusion because
    neither had tooling to independently query the live system (Monday.com) being audited. This is a
    real gap in how this panel is currently constituted for live-system integration work — a reviewer
    auditing whether a live action succeeded needs live read access to that system, or must state
    "cannot verify — no live access" as its primary and loudest finding rather than treating vault
    silence as proof of absence. Verity's own report did state this limitation explicitly but still
    led with FABRICATED as the classification rather than UNVERIFIABLE-BY-THIS-REVIEWER.
  who_should_have_caught_it: >-
    The panel-dispatch step (this session, producer) should have equipped Verity and Compass with
    Monday.com API read access before dispatch, or explicitly scoped their review to
    "vault-record consistency only" rather than "task completion." This is a process gap for future
    panels reviewing any live-system (non-vault) integration work.

error_count_reaching_hunter_before_being_caught: 0
