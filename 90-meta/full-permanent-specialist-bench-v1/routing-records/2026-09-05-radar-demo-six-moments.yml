schema_version: 2
objective: 'Review and revise the content and story flow of the six example moments in the MFC website''s
  fictional interactive Radar demonstration: for each scene produce the nine required fields (Direction,
  Radar moment, why it is recognisable, scene setup, three thought fragments, what the Radar makes visible,
  four optional Shift routes, three unranked possible next moves, what must not be implied), map each
  to a CONTEXTUAL-RECOMMENDATION-MODEL profile, report the five evaluation tests pass/fail per moment,
  and deliver a cross-scene duplication audit, a flow audit with a named screen count, a per-scene confidence
  rating, and only those decisions that genuinely cannot be inferred.'
task_session_id: d367dbe6-c1ad-4008-b357-0a055ad5ab98
