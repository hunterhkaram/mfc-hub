    exclusions carry stated reasons.
learning_disposition: candidate_update
what_changed_because_a_specialist_ran: 'The online Hour goes from 500 dollars to 600, the same as in person,
  because it is one product rather than a tier. Cards are posted when MFC is not in the room, costing
  25 dollars and closing the one buyer conversation where a single price fails. Online now costs 190 and
  keeps 410, against 351 and 249. The margin argument moved out of the rationale and is stated as cross-subsidy.
  A fabricated figure was cut: discounting gives away 100 dollars on every Hour sold is a projected loss
  on zero delivered sales. Three further findings applied: the Hour is a door not a destination, so every
  Hour ends with a named half-day conversation and conversion is tracked; the manager session is the one
  line a buyer can strike that changes what the half day can do; and fuel, parking and tolls are costed
  nowhere, so in-person costs more than the figures show. D-0140 amended to match, with the 500 dollar
  price explicitly withdrawn. No fourth product was added.'
