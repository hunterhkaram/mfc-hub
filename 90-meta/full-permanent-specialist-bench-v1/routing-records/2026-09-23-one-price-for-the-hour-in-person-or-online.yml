  omissions_challenged:
  - 'head-of-product was named mandatory and is excluded: nothing about what a participant experiences
    changed, only what MFC charges and how the cost is recorded. The exclusion that deserves scrutiny
    is head-of-compliance, because a charity printing a 72.5 per cent gross margin in its own committee
    paper is the kind of thing that reads badly to a funder or the ACNC. It is excluded because A-17 took
    that question directly, treated it as the strongest objection, and answered it by reframing the surplus
    as cross-subsidy rather than markup; a compliance lens would have been asked the same question and
    given the same answer from less commercial knowledge. What I did instead was record the residue A-17
    could not settle, which is that the bands above twenty were built on in-person cost and online cost
    does not rise with headcount, so a fifty-person online Hour is 1,000 dollars against about 190. That
    is the real exposure and it is written down rather than smoothed over.'
  changes: []
  unresolved:
  - 'The bands above twenty were built on in-person cost and have not been reworked for online, where
    cost does not rise with headcount; a fifty-person online Hour is 1,000 dollars against about 190.
    The 0.75-hour booking and preparation figures are founder estimates, not measured time. Vehicle costs
    are still uncosted. No price has been quoted to any buyer, and A-17''s closing point stands: two hesitations
    at 600 dollars would mean this discussion was about the wrong variable. Committee ratification of
    every price in D-0140 remains owed. The Appendix A reference still cannot be followed from a PDF.
    Hunter''s sign-off covers 29 blocks of 150. Jake has not seen this version.'
