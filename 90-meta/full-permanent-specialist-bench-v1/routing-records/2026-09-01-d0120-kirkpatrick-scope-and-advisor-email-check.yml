    before accepting them, which a tone pass would not have done. Also reconsidered whether D-0120 itself
    needed a separate H-01/A-12 clinical pass; excluded because it is a scope decision about which product
    gets which timepoints, not a participant-safety question -- no new participant-facing wording was
    introduced.
