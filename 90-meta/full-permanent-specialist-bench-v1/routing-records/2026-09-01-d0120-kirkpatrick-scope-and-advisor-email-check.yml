what_changed_because_a_specialist_ran: >
  A-24's adversarial check rewrote the advisor email before any external send. It found and
  corrected a false factual claim (the draft told Eimear Quigley that Onno van-Es had never met
  her; four committee transcripts show them on calls together since June -- corrected to name
  Onno and Debra Fidler as the actual first-meeting pair). It also found the draft silently
  omitted, while asking for wording review, that six IMTTAQ items are still placeholder text and
  that two new scenario questions are still an open design decision -- both are now disclosed in
  the email body itself, per the check's explicit instruction that this not be left for Eimear to
  discover on her own. It softened an overstated "architecture is settled" line, and flagged an
  unsourced "confirmed by research" claim about Kirkpatrick having no item bank, now stated as
  Hunter's own read rather than vault-verified fact. Separately, this same review corrected D-0120
  itself twice before it was finalised: removed an offered D-0115 Level-4 source that does not
  actually mention Kirkpatrick anywhere in its text, and reattributed a K-08 reasoning chain from
  K-08 itself to A-11's application of it.

  A second wave, four department heads (compliance, research, product, digital), then found five
  further changes before the email or forms could be treated as ready. Most consequential:
  head-of-research traced "IMTTAQ" to its origin and found the only primary source renders it
  "IMTAC" in an auto-transcript, with the full name appearing only in a non-verbatim extract; no
  published instrument under either name was locatable. This is an existence-unconfirmed problem,
  not a wording-unheld one. The email's "exactly two validated instruments" claim was withdrawn
  and replaced with a direct question to Eimear Quigley asking her to name and cite the actual
  instrument; MEASUREMENT-FORMS-v4.html's key, item table and blocker 1 were rewritten to the same
  effect. Head-of-compliance found the two participant disclaimers in the HTML directly
  contradicted each other ("nobody scores you" beside "when people score low...") -- corrected to
  "no one reviews or scores you individually." It also found D-0119's advisor-guidance table
  overstated AG-007 as "Followed" when the implementing wording is still a draft pending Eimear's
  review -- corrected to "addressed in draft, not yet followed," and surfaced an unchecked
  insurance exposure (professional-indemnity exclusion BUP026) now added as a named blocker and a
  line in the email. Head-of-digital found platform selection -- the single dependency the entire
  no-contact linkage design rests on for its anonymity promise -- was absent from every blocker
  list despite being flagged as open in every other source document; added as a blocker.
  Head-of-product found D-0120 reversed D-0111's "no data capture" characterisation of Introduction
  without surfacing the conflict, per CLAUDE.md section 4/2a; a surfacing note was added to D-0120
  rather than silently resolving it either way.
