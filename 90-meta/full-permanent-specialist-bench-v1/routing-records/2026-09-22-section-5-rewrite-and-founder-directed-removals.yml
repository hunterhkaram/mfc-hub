  omissions_challenged:
  - 'head-of-compliance and the Eimear lens were the hardest exclusions and are the ones worth stating
    plainly. Last turn I withheld the cap-of-twenty correction on L-088 grounds, reading D-0140''s ''set
    with the committee and a clinical adviser'' as an external basis. Hunter corrected that directly and
    he is right: D-0140 was written when an Essentials product existed, the line is now Introduction plus
    Foundations, and twenty was the Essentials and Foundations number. CLAUDE.md s2a is explicit that
    a later founder answer supersedes silently and must not be cited back at him, and s10a is explicit
    that MFC''s real committee governs safeguarding rather than this vault. Continuing to hold the paper
    against a superseded reading was the failure, not the fix. The same reasoning covers closing the safety
    items, which is Hunter''s and the committee''s call and not an AI lens''s. head-of-governance was
    reconsidered because removing the returns-to-committee label narrows the Chair''s own section 11 cell;
    excluded because Hunter ruled on it directly and the Chair reads the paper himself in the pre-read
    window. A-25 and A-08 were reconsidered for the section 5 prose; excluded because the wording came
    from Hunter''s own review and rewriting it through a lens would have replaced his voice with a composed
    one.'
