    approved priorities to its new home, so the regrouping is auditable rather than a redefinition, and
    no construct or framework term changed. head-of-marketing was reconsidered because section 5's right-hand
    column is now buyer-adjacent language; excluded because the column describes internal priorities to
    a committee, not a proposition to a buyer.
