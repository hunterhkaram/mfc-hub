what_changed_because_a_specialist_ran: Three changes from Jake, all applied. Section 5 goes from four
  focus areas to five, splitting education from evidence, with the right-hand column now summarising the
  April priorities instead of a one-line placeholder. A new Appendix D maps all thirteen approved priorities
  onto the five areas so nothing the committee signed off has silently disappeared. The funnel is rebuilt
  to work backwards from twenty sessions through separate warm and cold pathways with stated rates, warm
  and cold defined as Jake and Hunter agreed, and the executive summary's hundred-approach figure corrected
  to three hundred. A paragraph explains why the half day is the main product at a quarter of the volume.
  Contents rebuilt and verified against the rendered pages, 52 of 52 checks pass, 17 pages.
