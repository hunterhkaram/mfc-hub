coverage_challenge:
  selector: primary task context
  selector_context: primary-lead-generation-v2-ranked-model
  challenger: A-24 — Experimentation and Organisational Learning
  challenger_context: challenge-lead-generation-v2-ranked-model
  completed_before_execution: true
  decision_surfaces:
  - Which roles genuinely bear on this task, and which would only add volume
  omissions_challenged:
  - 'A-24 independently challenged omissions and inclusions. Omissions reconsidered and CONCEDED: A-20
    theory-of-change and A-16 habit design were excluded as product lenses and should have run - A-20
    would have named the attendee-to-budget-holder persuasion step as the load-bearing untested assumption
    rather than letting it be slipped in as an asset, A-16 would have named Hunter''s own adherence rather
    than audience attendance as the cadence risk. Both are now reflected in the deliverable. A-19 conceded
    as a point: distress risk sits in the tail and scales with promotion reach, so safeguarding and social-reach
    are one decision, though A-12''s controls already cover the operational response. STILL EXCLUDED after
    reconsideration: A-07, A-10, A-14, A-23, A-26, SYS-03 - no audience-facing UI, learning journey, visual
    identity, knowledge-structure or government-pathway decision is being made here. H-01 and H-02 were
    routed through A-12 rather than executed; disclosed as routing, not counted as coverage. INCLUSION
    challenged: A-24 argued A-25 added nothing and substituted itself for MFC''s real committee per L-064,
    and that A-18/A-22 overlapped. The A-25 challenge partly lands - its governance conclusion was in
    fact overturned - but its free/paid-boundary finding was accepted. The A-18/A-22 overlap objection
    is not conceded; each produced distinct accepted output.'
  changes:
  - Priority order inverted. A-24 established at source that nobody has ever been asked to buy anything
    (FINAL-08 line 82), so the panel had redesigned a strategy never executed once and had attached an
    unfalsifiable causal claim to the Black Dog programme. Running the existing ask became priority 1;
    the causal claim was struck from the deliverable.
  - A-25's classification of the free session as blocked pending a committee scope ruling was overturned.
    FINAL-03 channels 4 and 5, in the same pack to the same committee on the same day, instruct free 45-60
    minute facilitated tasters with dated success criteria; a blocker firing only on new proposals is
    not a control. D-0099 had already removed D-0016 as a gate by direct founder decision. Verified at
    source by the orchestrating context rather than accepted on either agent's word.
  - Free-session cadence narrowed from publish-twelve-dates to one invited session, then three at cadence
    unannounced, then announce.
  - 'Data exchange redesigned: organisation field optional, pre-form replaced by an in-session live poll,
    post-form moved on-screen to minute 28, monthly co-design form deferred to session two and capped.'
  - Free session reclassified from MFC-hosted acquisition channel to co-hosted conversion and evidence
    instrument fed by the ranked referral channels.
  unresolved:
  - Zero cohorts, zero sales, zero asks - nothing here is validated against a real market; it is reasoning,
    not evidence.
  - Insurance cover for free public online sessions is unconfirmed; written broker confirmation is the
    one genuinely non-negotiable pre-session item.
  - Facilitator distress-response and referral pathway require qualified clinical input; D-0016's six
    substantive matters remain unresolved per D-0099's own text.
  - Whether MFC is a health service provider under s6FB and therefore loses the small-business privacy
    exemption requires qualified legal input; the drafted AG-03/s6FB question remains unsent.
  - 'Control-state contradiction surfaced not reconciled: CLAUDE.md section 8 states the D-0016 safeguarding
    gate as current while D-0099 closed it as a gate on 2026-08-10. Flagged to Hunter per precedence rules.'
  - 'Founder decision open under section 6a condition 6: earned-revenue primary versus grant-funded free
    delivery, given the pivot toward the segment least able to pay.'
  - Three proposed lessons named in the decision trail are not yet written to 80-learning/.
  reconciler: SYS-04 — Loop Engineer
  reconciliation: Coverage retained as screened; contributions recorded as they actually occurred, and
    exclusions carry stated reasons.
