    modelling two hundred cold approaches for a fifth of the year''s delivery. That is a commercial position,
    not a wording slip. Excluded because the position was settled by Jake in the recorded session, in
    his own words about stabbing in the dark at low conversion, and endorsed in his guidance to cast the
    widest possible net; the task was to make the paper say what he and Hunter decided, not to form a
    commercial view. The funnel arithmetic has been recomputed four times. head-of-marketing was reconsidered
    because the second contradiction concerns what feeds the email list and therefore the lead narrative;
    excluded because the correction aligns the summary to the body''s existing route table and changes
    no channel decision. head-of-movement remains excluded as in the two prior tasks, the category language
    being quoted from MFC''s own strategy rather than paraphrased.'
