  decision_surfaces:
  - Whether to follow the corpus's own scoring, which ranks the human-services workforce first on the
    strongest evidence base MFC holds, or the founder instruction of 2026-08-19 which rejects that framing
    outright. Resolved for the founder instruction per CLAUDE.md section 2a, after verifying it at source,
    and head-of-commercial's sector recommendation is withdrawn on the record rather than quietly dropped.
  omissions_challenged:
  - 'A-25 (Board and Mission Strategy) was reconsidered for inclusion and stayed excluded, and the reason
    is the sharpest coverage decision on this task. The primary segment is a founder decision under AG-085
    and DoD section 6, and the committee''s own paper already carries a target-market section - so routing
    A-25 would have produced a second internal governance opinion about a question the committee already
    answered once and never ratified, which is exactly the redundant-governance-layer failure L-064 names.
    What the task needed instead was to FIND that paper and the two founder decisions, which is source
    work, and A-11 and A-17 did it. Excluded on the same reasoning: H-02 (regulatory) - the WHS and psychosocial
    material here is market intelligence about a buying trigger, not a compliance determination about
    MFC, and the one genuine regulatory exposure found (professional indemnity excluded by Chubb endorsement
    BUP026, no certificate of currency) is a question for MFC''s insurance broker, not for an AI lens,
    and is escalated as FQ4 rather than answered. H-01 (clinical) - no participant-facing content was
    designed. A-12 (accessibility and safeguarding) - one live safeguarding question surfaced, room 26''s
    C-16 exposure, and it is routed to head-of-compliance unanswered rather than resolved here. A-21 (partnerships)
    - its territory is fully covered by R1 Part 6''s existing named routes with phone numbers, and re-running
    it would have produced the same list at cost.'
  changes:
  - '04-THE-STRATEGY.md created: seven candidate segments, a four-criterion scoring table with a source
    per cell, a recommended primary at 6/10 confidence with five stated costs, the evidence synthesis,
    the content layer and the join.'
  - '01-THE-PLAN.md J1: every channel re-derived from the primary segment. Partnerships becomes the spine;
    professional rooms marked UNVERIFIED rather than re-rated on an invented number.'
  - '01-THE-PLAN.md J2: the thirty rooms re-sorted 16 buyer-capable / 10 mission / 4 serving neither;
    rooms 5, 6, 12 and 26 removed; the mission rooms ruled out of the lead-gen line and into their own.'
  - '01-THE-PLAN.md J3: community rooms drop 0.1 to 0; total 3.0 to ~2.9 clients; one field added to the
    room log so the professional-rooms assumption becomes checkable in two visits.'
  unresolved:
  - The primary segment itself is Hunter's under AG-085 and DoD section 6 - six founder questions are
    recorded verbatim. Zero primary buyer research has ever been conducted in any segment, and the instruments
    to do it exist unused. Professional indemnity is not held and is actively excluded; no certificate
    of currency exists. C-13 and C-18 are open and bear on messaging and grant language. Eight stale records
    are named and not fixed, including the frozen DoD's own false absence claim.
  reconciler: SYS-04 — Loop Engineer
  reconciliation: Coverage retained as screened; contributions recorded as they actually occurred, and
    exclusions carry stated reasons.
