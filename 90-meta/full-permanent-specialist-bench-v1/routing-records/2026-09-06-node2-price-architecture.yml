  decision_surfaces:
  - 'Whether to recommend a repeat-cohort discount. The document initially did; D-0122 section 4 refuted
    it and the recommendation was withdrawn rather than defended. Five founder questions reach Hunter:
    whether D-0122 rule 6''s two-group cap permits a third as a separate sequential engagement; whether
    to publish a commercial tier or hold it behind a trigger; MFC''s stated position on the free competitor;
    which buyer MFC is pricing for given D1-who-actually-pays and 04-THE-STRATEGY conflict; and whether
    the Foundations floor is 8 rather than D-0121''s 3.'
  omissions_challenged:
  - 'researcher screened in and excluded: the brief permitted one only if a comparable R2 does not hold,
    and this is a structural question - R2''s 23 provider pages plus the pricing case''s fresh 2026-09-06
    external pass cover the market, and no new comparator changes how a price flexes across buyer type.
    A-15 head-of-delivery is the closest call and its exclusion is this screen''s weakest point: the travel
    radius term, the instalment mechanics and the multi-cohort contract form are all genuinely its subject,
    all three are live gaps this document names, and the travel radius is the difference between Small
    Team being viable and not. Excluded because each is a gap to be written rather than a judgement to
    be made; naming them is what this document owes and writing them is a separate bounded task. A-11
    head-of-research excluded despite owning P27, the one sentence that would close a sale, because filling
    it needs a registered comparable study rather than a lens on this document. A-25 and SYS-03 screened
    and not implicated - no committee process or capacity question is decided here.'
  changes: []
  unresolved:
  - GST registration status is contradicted inside MFC's own live documents and is blocking on anything
    buyer-facing. The travel radius term does not exist and Small Team goes below cost without it. MFC
    cannot yet contract per D-0103's 2026-08-17 amendment. AG-325's insurance change-of-use is open since
    July 2026 and this document makes the declared turnover of 20000 wrong. Professional indemnity is
    not held and three of five NSW principal criteria are unevidenced. Account-management hours are unreconciled
    between 07 and FINAL-06, now bounded rather than left open. D-0113 and 110-PRODUCT-AND-PRICING-BOOK
    are superseded on cost basis and not marked superseded_by. No advisor has reviewed any of these numbers.
    Zero cohorts, zero quotes, zero buyer interviews.
  reconciler: SYS-04 — Loop Engineer
  reconciliation: Coverage retained as screened; contributions recorded as they actually occurred, and
    exclusions carry stated reasons.
learning_disposition: candidate_update
what_changed_because_a_specialist_ran: 'The three-way cost seam is closed with a disclosed sensitivity
  showing the conclusions survive either basis. Hunter''s Essentials-led premise was worked rather than
  accepted: the money case''s 91-sales figure is the entry-band worst case, the binding constraint is
  sales events not delivery hours, and the whole-organisation quote rather than the single-room quote
  is the lever. Five claims in the existing corpus were refuted: that the ladder gives better value per
  head; that MFC has no free-competitor answer; that the manager-session amortisation is unconditional;
  that R6''s manager-versus-staff distinction is true; and that a repeat discount is warranted. The document''s
  own first draft was found to breach D-0122 rule 2 against the buyer by 32% and was corrected. The review
  clause AG-088 asked for in July 2026 became fireable.'
