what_changed_because_a_specialist_ran: 'Both lenses found real defects inside their bounds and all were
  fixed. The scoring key was rendered to participants - the correct answers on Form 1''s two comprehension
  items carried a tick and the word keyed, voiding both items. Five free-text answers could not be given
  at all: the generator matched short text but not long text, so the placeholder printed as literal text
  instead of a box, and AG-545''s other-please-specify route had a label with no input under it. The verbatim
  drift check was reporting no drift while comparing nothing: its needle for item 2b, the primary change
  score, matched zero blocks because it straddled a source line wrap, and a substring approach could never
  see drift in an option. It is rewritten to compare rendered blocks keyed on their stems, now covers
  eight pairs, and is proven to refuse the build when a single option changes on one form. The Form 5
  gate did not route - items behind it stayed visible and answerable, so a participant could answer an
  IMTTAQ statement and then close the gate, storing a published three-item subscale with one real value
  and two not-reached codes. Code normalisation dropped accented characters silently, so the same person
  writing Angela with and without the accent at two timepoints produced two codes that never join. The
  Apps Script backend always returns HTTP 200, so a failed write showed a thank-you screen and cleared
  the local draft. Assets are now content-stamped, because the browser served a cached runtime against
  freshly built questions during this very verification and made two working fixes look broken.'
