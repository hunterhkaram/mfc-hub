  omissions_challenged:
  - 'head-of-compliance was reconsidered and deliberately NOT run as a gate on this build. Hunter said
    build. Convening a compliance lens before a single form existed would have reproduced exactly the
    internally-generated gate CLAUDE.md section 12 and L-064 exist to stop, and it would have been the
    third such gate in this session, the same error head-of-digital just found inside D-0133 itself. The
    two questions that genuinely need that lens are recorded as open before a participant sees a form:
    whether a six-character code inside a single-employer cohort is de-identified or only pseudonymised,
    and who monitors the withdrawal inbox the consent panel now promises. head-of-research was excluded
    because no question changed: the generator renders the already-approved set and refuses to build if
    any of the seventeen verbatim pairs has drifted. head-of-governance was excluded from the build, but
    its subject matter is now live: D-0133 needs amending rather than deleting, and Rachel Willis should
    see the residency finding first.'
  changes: []
  unresolved:
  - Nobody monitors a withdrawal inbox and the consent panel now promises a 90-day window. Whether the
    participant code is genuinely de-identified inside a single-employer cohort is head-of-compliance's
    call against the instrument. D-0133's residency clause should be amended rather than deleted, with
    the reasoning recorded so it is not re-derived. The Apps Script CORS path is unverified and is the
    first thing to test on deployment. Account ownership must sit with an MFC-owned Google account and
    a second admin at setup.
  reconciler: SYS-04 — Loop Engineer
  reconciliation: Coverage retained as screened; contributions recorded as they actually occurred, and
    exclusions carry stated reasons.
learning_disposition: no_new_learning
what_changed_because_a_specialist_ran: 'head-of-digital''s execution changed the hosting decision outright.
  The recommendation moved from a LimeSurvey instance on a Sydney VPS at about AU$220 a year to Cloudflare
  Pages plus an Apps Script endpoint at AU$0, and the Australian data-residency clause in D-0133 that
  had excluded Google infrastructure was shown to have no external basis at all. Its silent-data-loss
  warning produced two runtime changes that would not otherwise exist: the payload is written to localStorage
  before the POST and cleared only on a confirmed 200, and a failed send now says so instead of showing
  the thank-you screen. Separately, the build itself: the five placeholder values are set with reasoning,
  the three retention objects collapse to one 90-day date because withdrawal is verified against the cohort
  email list and cannot outlive it, and form-set-v2 generates all six forms from the markdown source and
  refuses to build on verbatim-pair drift. The hand-built form-set is marked superseded. Three defects
  were found by running the forms rather than reading them: Form 5 rendered MFC''s reporting rules to
  participants as questions, source line-wraps broke the consent panel mid-sentence six times, and a loop
  counter shared between two functions meant WHO-5 stored W1 and silently dropped W2 to W5 while both
  IMTTAQ subscales stored one item of three.'
