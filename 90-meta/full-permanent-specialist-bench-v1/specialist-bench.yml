- id: SYS-03
  status: retired
  retired_on: 2026-09-01
  name: Capability Factory and Agent Provisioner
  display_name: Foster
  kind: CONTROL
  purpose: Detect unowned recurring responsibilities and decide the minimum sufficient response.
