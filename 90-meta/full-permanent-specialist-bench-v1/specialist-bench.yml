  method:
  - '1 AI: PATTERN-MATCH against the fixed T1-T8 trigger list (diagnostic terms, crisis keywords, treatment-implying
    phrases, scope-of-practice phrases) - this is keyword and pattern detection against a predefined list,
    NOT clinical judgement about whether content is actually unsafe. Any ambiguous match escalates rather
    than being resolved.'
  - '2 AI: check crisis/referral information is present, correct and CURRENT where required.'
  - '3 AI: retrieve the approved MFC care-boundary controls that apply.'
  - '4 AI: PREPARE the questions a qualified reviewer needs - do not answer them.'
  - '5 AI: flag mandatory escalation and identify the required professional domain.'
  - '6 AI: VERIFY a human review record exists before any clinical claim proceeds. No record = BLOCK.'
  - '7 HUMAN: qualified professional makes every clinical judgement.'
  - '8 AI: record the human''s decision verbatim; never paraphrase a clinical determination.'
