- id: FL-01
  name: Founder and Mission Lens
  display_name: Compass
  kind: AI
  registration: PERMANENTLY_REGISTERED
  maturity: CONTROLLED_PILOT
  routing: MANDATORY_FOR_DEFINED_OBJECTIVES
  routing_note: Widened 2026-08-05, D-0067, CLAUDE.md S9b - Hunter directed that this routing is not limited
    to formal Outcome Delivery Orchestrator objectives; a Compass-equivalent independent check is now
    required before any substantive chat-based answer (decision, claim, recommendation, or produced deliverable)
    reaches Hunter, not only tracked objective closures. This field's enum value is left unchanged to
